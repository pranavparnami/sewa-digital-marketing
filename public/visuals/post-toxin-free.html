<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SEWA Post — Toxin-Free Truth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh}
.post{width:600px;height:600px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#F5F0E8,#EADCC8,#F0E4D0)}
.marble{position:absolute;inset:0;opacity:0.15;
  background:radial-gradient(ellipse at 30% 50%,#8B7D6B 0%,transparent 50%),
             radial-gradient(ellipse at 70% 20%,rgba(180,83,9,0.3) 0%,transparent 40%),
             radial-gradient(ellipse at 60% 80%,#8B7D6B 0%,transparent 30%)}
.light{position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(105deg,transparent 0%,rgba(255,248,235,0.3) 30%,transparent 60%)}
.box{position:absolute;top:50%;left:50%;transform:translate(-55%,-55%);
  width:160px;height:180px;background:#D4A574;border-radius:8px;
  box-shadow:8px 8px 25px rgba(0,0,0,0.15)}
.box-inner{position:absolute;inset:12px;background:#FAF7F2;border-radius:4px;
  border:1px solid #C49A6C;display:flex;flex-direction:column;align-items:center;justify-content:center}
.box-label{font-family:Georgia,serif;font-size:16px;color:#B45309;font-weight:bold;letter-spacing:2px}
.box-sub{font-family:system-ui,sans-serif;font-size:8px;color:#8B6914;text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.sticks-area{position:absolute;top:38%;left:58%;display:flex;gap:3px;transform:rotate(-12deg)}
.stick-item{width:3px;height:75px;background:linear-gradient(to top,#C49A6C,#F5E6D3);border-radius:2px}
.stick-item:nth-child(2){height:80px;margin-top:-5px}
.stick-item:nth-child(3){height:70px;margin-top:10px}
.eucalyptus1{position:absolute;top:22%;left:25%;width:80px;height:55px;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 55"><ellipse cx="20" cy="25" rx="10" ry="18" fill="%237B9B6A" transform="rotate(-30 20 25)"/><ellipse cx="35" cy="20" rx="8" ry="15" fill="%236B8B5A" transform="rotate(-15 35 20)"/><ellipse cx="50" cy="28" rx="9" ry="16" fill="%237B9B6A" transform="rotate(10 50 28)"/><ellipse cx="65" cy="22" rx="7" ry="14" fill="%235A7B4A" transform="rotate(25 65 22)"/></svg>') no-repeat;background-size:contain}
.eucalyptus2{position:absolute;top:45%;right:18%;width:70px;height:50px;transform:rotate(40deg);
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 50"><ellipse cx="15" cy="22" rx="8" ry="16" fill="%237B9B6A" transform="rotate(-20 15 22)"/><ellipse cx="30" cy="18" rx="7" ry="14" fill="%236B8B5A"/><ellipse cx="45" cy="24" rx="9" ry="15" fill="%237B9B6A" transform="rotate(15 45 24)"/><ellipse cx="58" cy="20" rx="6" ry="13" fill="%235A7B4A" transform="rotate(30 58 20)"/></svg>') no-repeat;background-size:contain}
.burning-holder{position:absolute;top:55%;left:72%;width:30px;height:22px;
  background:linear-gradient(135deg,#F5E6D3,#E8D4C0);border-radius:12px 12px 3px 3px}
.burning-stick{position:absolute;top:42%;left:73%;width:2px;height:50px;background:#C49A6C;
  border-radius:1px;transform:rotate(8deg)}
.burning-glow{position:absolute;top:47%;left:72%;width:8px;height:8px;
  background:radial-gradient(circle,#FF8C42,#B45309 50%,transparent);
  border-radius:50%;box-shadow:0 0 12px rgba(255,140,66,0.4)}
.wisp{position:absolute;top:28%;left:73.5%;width:1px;height:60px;background:rgba(255,255,255,0.15);
  border-radius:50%;transform:rotate(-5deg);animation:wisp 3s infinite}
@keyframes wisp{0%{opacity:0.3;height:40px}50%{opacity:0.5;height:70px}100%{opacity:0;height:100px}}
.card{position:absolute;bottom:12%;right:12%;width:150px;background:#FAF7F2;
  border-radius:4px;padding:12px 10px;box-shadow:3px 3px 12px rgba(0,0,0,0.08);
  transform:rotate(-3deg);border:1px solid #E8D5B7}
.card-text{font-family:'Georgia',serif;font-size:10px;color:#3D2B1F;text-align:center;
  text-transform:uppercase;letter-spacing:1px;line-height:1.6}
.brand{position:absolute;top:6%;left:6%;font-family:'Georgia',serif;font-size:24px;
  color:#B45309;font-weight:bold;letter-spacing:4px;opacity:0.8}
</style></head><body>
<div class="post">
  <div class="marble"></div>
  <div class="light"></div>
  <div class="brand">SEWA</div>
  <div class="box"><div class="box-inner"><div class="box-label">SEWA</div><div class="box-sub">Luxury Incense</div></div></div>
  <div class="sticks-area"><div class="stick-item"></div><div class="stick-item"></div><div class="stick-item"></div></div>
  <div class="eucalyptus1"></div>
  <div class="eucalyptus2"></div>
  <div class="burning-holder"></div>
  <div class="burning-stick"></div>
  <div class="burning-glow"></div>
  <div class="wisp"></div>
  <div class="card">
    <div class="card-text">Phthalate-Free<br>Toxin-Free<br>Charcoal-Free</div>
  </div>
</div>
</body></html>
