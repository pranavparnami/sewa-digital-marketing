<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SEWA Story — Morning Ritual</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh}
.story{width:540px;height:960px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#F5E6D3 0%,#E8D5B7 30%,#D4A574 60%,#B45309 100%)}
.sunlight{position:absolute;top:-60px;right:-80px;width:400px;height:700px;
  background:radial-gradient(ellipse,rgba(255,248,235,0.7) 0%,rgba(255,215,0,0.3) 40%,transparent 70%);
  transform:rotate(-15deg)}
.curtain-left,.curtain-right{position:absolute;top:0;width:80px;height:100%;
  background:linear-gradient(to bottom,rgba(255,250,240,0.9),rgba(245,235,220,0.7));
  border-right:1px solid rgba(180,83,9,0.1)}
.curtain-right{right:0;left:auto;border-left:1px solid rgba(180,83,9,0.1);border-right:none}
.table{position:absolute;bottom:140px;left:40px;right:40px;height:12px;
  background:linear-gradient(to bottom,#8B6914,#6B4E0A);border-radius:4px;
  box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.journal{position:absolute;bottom:165px;left:80px;width:120px;height:160px;
  background:#FAF7F2;border-radius:3px;box-shadow:2px 2px 8px rgba(0,0,0,0.1);
  background-image:linear-gradient(#E8D5B7 1px,transparent 1px);background-size:100% 20px}
.cup{position:absolute;bottom:160px;right:100px}
.cup-body{width:55px;height:60px;background:#D4A574;border-radius:6px 6px 10px 10px;
  box-shadow:2px 2px 8px rgba(0,0,0,0.15);position:relative}
.cup-handle{width:20px;height:25px;border:5px solid #C49A6C;border-left:none;border-radius:0 15px 15px 0;
  position:absolute;right:-18px;top:18px}
.cup-rim{width:55px;height:6px;background:#B8895A;border-radius:4px 4px 0 0}
.steam{position:absolute;top:-25px;left:12px;width:3px;height:20px;background:rgba(255,255,255,0.4);
  border-radius:50%;animation:steam 2s infinite}
@keyframes steam{0%{opacity:0;transform:translateY(0)}50%{opacity:0.6;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-20px)}}
.holder{position:absolute;bottom:158px;left:220px;width:40px;height:30px;
  background:linear-gradient(135deg,#F5E6D3,#E8D4C0);border-radius:20px 20px 4px 4px;
  box-shadow:2px 2px 10px rgba(0,0,0,0.1)}
.stick{position:absolute;bottom:188px;left:237px;width:3px;height:50px;background:#C49A6C;
  transform:rotate(-5deg);border-radius:2px}
.glow{position:absolute;bottom:182px;left:234px;width:10px;height:10px;
  background:radial-gradient(circle,#FF6B1A,#B45309 60%,transparent);
  border-radius:50%;box-shadow:0 0 15px rgba(255,107,26,0.5)}
.smoke{position:absolute;bottom:195px;left:235px;width:30px;height:80px}
.smoke::after{content:'';position:absolute;width:2px;height:60px;background:rgba(255,255,255,0.2);
  border-radius:50%;animation:smokeRise 3s infinite;left:5px}
@keyframes smokeRise{0%{opacity:0.4;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(0.3)}}
.hand{position:absolute;bottom:190px;left:260px;font-size:40px;opacity:0.9}
.poll{position:absolute;bottom:30px;left:30px;right:30px;height:70px;
  background:rgba(255,255,255,0.92);border-radius:16px;padding:12px 16px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);backdrop-filter:blur(10px)}
.poll-text{font-family:system-ui,sans-serif;font-size:15px;color:#3D2B1F;font-weight:600;margin-bottom:8px}
.poll-options{display:flex;gap:8px}
.poll-opt{flex:1;padding:6px;background:#FAF7F2;border:1.5px solid #D4A574;border-radius:20px;
  text-align:center;font-family:system-ui,sans-serif;font-size:11px;color:#8B6914;
  cursor:pointer;transition:all 0.2s}
.poll-opt:hover{background:#B45309;color:white;border-color:#B45309}
.title-bar{position:absolute;top:50px;left:30px;right:30px;font-family:system-ui,sans-serif;
  color:#3D2B1F;font-size:13px;opacity:0.8;display:flex;align-items:center;gap:8px}
.title-bar .dot{width:8px;height:8px;background:#B45309;border-radius:50%}
</style></head><body>
<div class="story">
  <div class="sunlight"></div>
  <div class="curtain-left"></div>
  <div class="curtain-right"></div>
  <div class="title-bar"><span class="dot"></span> @SEWAaromas · 2h ago</div>
  <div class="table"></div>
  <div class="journal"></div>
  <div class="cup"><div class="cup-body"><div class="cup-rim"></div><div class="cup-handle"></div></div><div class="steam"></div></div>
  <div class="holder"></div>
  <div class="stick"></div>
  <div class="glow"></div>
  <div class="smoke"></div>
  <div class="hand">🤚</div>
  <div class="poll">
    <div class="poll-text">What is your morning ritual? ☀️</div>
    <div class="poll-options">
      <div class="poll-opt">Incense & Chai</div>
      <div class="poll-opt">Meditation</div>
      <div class="poll-opt">Journaling</div>
    </div>
  </div>
</div>
</body></html>
